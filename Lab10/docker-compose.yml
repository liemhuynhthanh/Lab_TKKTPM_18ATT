version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: food-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user_service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=user_db
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure

  food-service:
    build: ./food-service
    container_name: food-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=food_db
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=order_db
      - DB_DIALECT=mariadb
      - USER_SERVICE_URL=http://user-service:8081
      - FOOD_SERVICE_URL=http://food-service:8082
    depends_on:
      mariadb:
        condition: service_healthy
      user-service:
        condition: service_started
      food-service:
        condition: service_started
    restart: on-failure

  payment-service:
    build: ./Payment_Service
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=payment_db
      - ORDER_SERVICE_URL=http://order-service:8083
    depends_on:
      mariadb:
        condition: service_healthy
      order-service:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./food-order-frontend
      args:
        - REACT_APP_USER_SERVICE_URL=http://localhost:8081
        - REACT_APP_FOOD_SERVICE_URL=http://localhost:8082
        - REACT_APP_ORDER_SERVICE_URL=http://localhost:8083
        - REACT_APP_PAYMENT_SERVICE_URL=http://localhost:8084
    container_name: food-frontend
    ports:
      - "3000:80"
    depends_on:
      - user-service
      - food-service
      - order-service
      - payment-service

volumes:
  mariadb_data:
